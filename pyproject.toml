[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtest-framework"
version = "0.1.0"
description = "A DAG-driven, data-driven API automation testing framework for SDET"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kanoisele", email = "2091701635@qq.com" }]
keywords = ["testing", "automation", "api", "sdet", "test-framework", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    "jsonpath-ng>=1.6",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
flowtest = "flowtest.cli:main"

[project.urls]
Homepage = "https://github.com/kanoisele/flowtest-framework"
Issues = "https://github.com/kanoisele/flowtest-framework/issues"

[tool.setuptools.packages.find]
include = ["flowtest*"]

[tool.setuptools.package-data]
flowtest = ["examples/testcases/*.yaml", "examples/testcases/*.yml", "examples/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["flowtest"]
