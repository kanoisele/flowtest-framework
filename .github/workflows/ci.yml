name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check flowtest tests

      - name: Framework self-test (unit + integration, with coverage)
        run: pytest --cov=flowtest --cov-report=term-missing --cov-report=xml

      - name: Static DSL validation (no HTTP requests)
        run: flowtest validate testcases

      - name: End-to-end demo run
        run: flowtest demo --parallel 3 --report report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowtest-report-py${{ matrix.python-version }}
          path: report.html
          if-no-files-found: ignore
